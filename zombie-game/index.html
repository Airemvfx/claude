<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>☠ DEAD ZONE 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    canvas { position: absolute; top: 0; left: 0; display: block; }
    #hud { z-index: 2; }
  </style>
</head>
<body>
<canvas id="gc"></canvas>
<canvas id="hud"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ── RENDERER / SCENE / CAMERA ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040d06);
scene.fog = new THREE.FogExp2(0x040d06, 0.028);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 120);

const gc = document.getElementById('gc');
const renderer = new THREE.WebGLRenderer({ canvas: gc, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);

const hud = document.getElementById('hud');
const hx  = hud.getContext('2d');
hud.width = innerWidth; hud.height = innerHeight;

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  hud.width = innerWidth; hud.height = innerHeight;
});

// ── LIGHTING ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x223322, 1.0));
const moon = new THREE.DirectionalLight(0x8899bb, 1.4);
moon.position.set(8, 20, 5);
scene.add(moon);
const glow = new THREE.PointLight(0x33ff55, 0.5, 14);
scene.add(glow);

// ── GROUND ──────────────────────────────────────────────────────────────────
const gGeo = new THREE.PlaneGeometry(120, 120, 40, 40);
{ const p = gGeo.attributes.position; for (let i=0;i<p.count;i++) p.setZ(i,(Math.random()-.5)*.1); gGeo.computeVertexNormals(); }
const groundMesh = new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({ color: 0x182814 }));
groundMesh.rotation.x = -Math.PI/2;
scene.add(groundMesh);
scene.add(new THREE.GridHelper(120, 40, 0x1c2a18, 0x172214));

// Decorative rubble/crates
for (let i=0;i<30;i++) {
  const w=.4+Math.random()*.9, h=.3+Math.random()*1.8, d=.4+Math.random()*.9;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({ color: [0x1a2a15,0x22331a,0x1e2e18,0x15201a][i%4] }));
  let x,z; do { x=(Math.random()-.5)*100; z=(Math.random()-.5)*100; } while(Math.hypot(x,z)<6);
  m.position.set(x, h/2, z);
  m.rotation.y = Math.random()*Math.PI;
  scene.add(m);
}

// ── MESH HELPERS ────────────────────────────────────────────────────────────
function bx(w,h,d,color,emissive=0) {
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color, emissive}));
}

// Player mesh — default faces -Z (gun arm at +X side pointing -Z)
function makePlayerMesh() {
  const g = new THREE.Group();
  const ll=bx(.28,.72,.28,0x1a3a99); ll.position.set(-.22,.36,0); g.add(ll);
  const rl=bx(.28,.72,.28,0x1a3a99); rl.position.set( .22,.36,0); g.add(rl);
  const t =bx(.84,1.02,.44,0x2255cc); t.position.y=1.1; g.add(t);
  const h =bx(.52,.52,.52,0xcc9966); h.position.y=1.86; g.add(h);
  // gun arm + barrel
  const arm=bx(.18,.72,.18,0x1a3a99); arm.position.set(.52,1.02,0); g.add(arm);
  const gun=bx(.1,.1,.7,0x1a1a1a); gun.position.set(.52,1.1,-.42); g.add(gun);
  return g;
}

// Zombie meshes — hunched, arms forward, faces -Z by default
function makeZombieMesh(type) {
  const g = new THREE.Group();
  const sc = type===2?1.45:type===1?.8:1.0;
  const bc = [0x3a7a2e,0x7a3030,0x2e4a7a][type];
  const s = sc;
  // Legs (stumble offset)
  const ll=bx(.3*s,.68*s,.3*s,bc); ll.position.set(-.2*s,.34*s,.05*s); ll.rotation.z=.14; g.add(ll);
  const rl=bx(.3*s,.68*s,.3*s,bc); rl.position.set( .2*s,.34*s,-.05*s); rl.rotation.z=-.14; g.add(rl);
  // Torso (hunched forward)
  const t=bx(.9*s,1.0*s,.48*s,bc); t.position.y=.98*s; t.rotation.x=.28; g.add(t);
  // Arms outstretched forward
  const la=bx(.22*s,.82*s,.22*s,bc); la.position.set(-.6*s,.94*s,-.28*s); la.rotation.z=.75; la.rotation.x=.6; g.add(la);
  const ra=bx(.22*s,.82*s,.22*s,bc); ra.position.set( .6*s,.94*s,-.28*s); ra.rotation.z=-.75; ra.rotation.x=.6; g.add(ra);
  // Head (tilted)
  const h=bx(.58*s,.54*s,.54*s,bc); h.position.set(0,1.64*s,-.12*s); h.rotation.x=.32; g.add(h);
  // Eyes (emissive red)
  const eM=new THREE.MeshBasicMaterial({color:0xff2200});
  const eG=new THREE.BoxGeometry(.11*s,.09*s,.06*s);
  const le=new THREE.Mesh(eG,eM); le.position.set(-.15*s,1.65*s,-.38*s); g.add(le);
  const re=new THREE.Mesh(eG,eM); re.position.set( .15*s,1.65*s,-.38*s); g.add(re);
  return g;
}

// ── STATE ───────────────────────────────────────────────────────────────────
const S = {MENU:0,PLAY:1,OVER:2};
let state = S.MENU;

let P={};
const zombies=[], bullets=[], parts=[], pickups=[];
let score=0, wave=0, hs=+localStorage.getItem('dz3_hs')||0;
let zToSpawn=0, zDelay=0, zTimer=0, waveDone=false, waveTimer=0;
let flash=0, frame=0, camX=0, camZ=0;

// ── ZOMBIE TYPES ─────────────────────────────────────────────────────────────
const ZT=[
  {r:.58,spd:.068,hp:60, dmg:10,pts:10,mw:1,type:0},
  {r:.44,spd:.13, hp:35, dmg:8, pts:20,mw:2,type:1},
  {r:.88,spd:.04, hp:220,dmg:20,pts:50,mw:4,type:2},
];

function mkPlayer() {
  if (P.mesh) scene.remove(P.mesh);
  P={mesh:makePlayerMesh(),x:0,z:0,r:.72,spd:.15,hp:100,maxHp:100,
     ang:0,fc:0,fr:18,dmg:40,inv:0,kills:0};
  scene.add(P.mesh);
}

// ── WAVE ────────────────────────────────────────────────────────────────────
function nextWave() {
  wave++;
  zToSpawn=5+wave*3; zDelay=Math.max(15,60-wave*3); zTimer=30;
  waveDone=false; waveTimer=0;
}

function spawnZombie() {
  const el=ZT.filter(t=>t.mw<=wave);
  const wts=el.map((_,i)=>[3,1.5,.5][i]??0.5);
  let r=Math.random()*wts.reduce((a,b)=>a+b,0), tp=el[0];
  for(let i=0;i<el.length;i++){r-=wts[i];if(r<=0){tp=el[i];break;}}
  const a=Math.random()*Math.PI*2, d=22+Math.random()*5;
  const sx=P.x+Math.cos(a)*d, sz=P.z+Math.sin(a)*d;
  const hp=tp.hp+wave*6;
  const mesh=makeZombieMesh(tp.type);
  mesh.position.set(sx,0,sz);
  scene.add(mesh);
  zombies.push({mesh,x:sx,z:sz,r:tp.r*(tp.type===2?1.4:1),
    spd:tp.spd+wave*.003,hp,mhp:hp,dmg:tp.dmg,pts:tp.pts,
    ang:0,wob:Math.random()*Math.PI*2,ws:.04+Math.random()*.04,
    stun:0,type:tp.type});
}

// ── BULLETS ─────────────────────────────────────────────────────────────────
const bGeo=new THREE.SphereGeometry(.13,5,4);
const bMat=new THREE.MeshBasicMaterial({color:0xffee44});

function fireBullet() {
  if(P.fc>0||!zombies.length) return;
  let nearest=zombies[0],nd=Infinity;
  for(const z of zombies){const d=Math.hypot(z.x-P.x,z.z-P.z);if(d<nd){nd=d;nearest=z;}}
  const ang=Math.atan2(nearest.z-P.z,nearest.x-P.x);
  P.ang=ang;
  P.mesh.rotation.y=-ang-Math.PI/2;
  const a2=ang+(Math.random()-.5)*.05;
  const m=new THREE.Mesh(bGeo,bMat);
  m.position.set(P.x+Math.cos(ang)*(P.r+.1),1.1,P.z+Math.sin(ang)*(P.r+.1));
  scene.add(m);
  bullets.push({mesh:m,x:m.position.x,z:m.position.z,vx:Math.cos(a2)*.55,vz:Math.sin(a2)*.55,life:60});
  P.fc=P.fr;
}

// ── PARTICLES ───────────────────────────────────────────────────────────────
const MAX_P=80;
const pGeo=new THREE.SphereGeometry(.07,3,3);

function blood(x,z,n=8) {
  for(let i=0;i<n;i++){
    if(parts.length>=MAX_P) break;
    const a=Math.random()*Math.PI*2, s=.02+Math.random()*.12;
    const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:0xcc1111,transparent:true}));
    m.position.set(x,.4+Math.random()*.4,z);
    scene.add(m);
    parts.push({mesh:m,vx:Math.cos(a)*s,vy:.05+Math.random()*.1,vz:Math.sin(a)*s,life:30+~~(Math.random()*40),ml:70});
  }
}

const pkGeo=new THREE.BoxGeometry(.55,.55,.55);
function mkPickup(x,z) {
  if(Math.random()>.2) return;
  const type=Math.random()<.65?'hp':'spd';
  const m=new THREE.Mesh(pkGeo,new THREE.MeshBasicMaterial({color:type==='hp'?0xff4444:0x44aaff,transparent:true,opacity:.92}));
  m.position.set(x,.5,z);
  scene.add(m);
  pickups.push({mesh:m,x,z,type,life:360,pulse:0,r:.6});
}

// ── INPUT ───────────────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',  e=>keys[e.key]=false);
const joy={on:false,id:-1,bx:0,by:0,tx:0,ty:0,dx:0,dy:0,mr:55};

// ── UPDATE ──────────────────────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t;}

function update() {
  if(state!==S.PLAY) return;
  frame++;

  // Movement
  P.x+=joy.dx*P.spd; P.z+=joy.dy*P.spd;
  if(keys['ArrowLeft'] ||keys['a']||keys['A']) P.x-=P.spd;
  if(keys['ArrowRight']||keys['d']||keys['D']) P.x+=P.spd;
  if(keys['ArrowUp']   ||keys['w']||keys['W']) P.z-=P.spd;
  if(keys['ArrowDown'] ||keys['s']||keys['S']) P.z+=P.spd;
  P.x=Math.max(-48,Math.min(48,P.x)); P.z=Math.max(-48,Math.min(48,P.z));
  P.mesh.position.set(P.x,0,P.z);
  glow.position.set(P.x,3,P.z);

  // Leg walk anim
  const la=Math.sin(frame*.25)*.18;
  if(joy.on||(keys['ArrowLeft']||keys['ArrowRight']||keys['ArrowUp']||keys['ArrowDown'])){
    P.mesh.children[0].rotation.x= la;
    P.mesh.children[1].rotation.x=-la;
  }

  if(P.fc>0)P.fc--; if(P.inv>0)P.inv--;
  fireBullet();

  // Spawn
  if(zToSpawn>0&&--zTimer<=0){spawnZombie();zToSpawn--;zTimer=zDelay;}

  // Zombies
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.stun>0){z.stun--;continue;}
    z.wob+=z.ws;
    z.ang=Math.atan2(P.z-z.z,P.x-z.x)+Math.sin(z.wob)*.12;
    z.x+=Math.cos(z.ang)*z.spd; z.z+=Math.sin(z.ang)*z.spd;
    z.mesh.position.set(z.x,0,z.z);
    z.mesh.rotation.y=-z.ang-Math.PI/2;
    z.mesh.rotation.z=Math.sin(z.wob*1.4)*.07;
    if(Math.hypot(z.x-P.x,z.z-P.z)<z.r+P.r&&P.inv<=0){
      P.hp-=z.dmg; P.inv=50; flash=12;
      if(P.hp<=0){P.hp=0;blood(P.x,P.z,25);state=S.OVER;if(score>hs){hs=score;localStorage.setItem('dz3_hs',hs);}return;}
    }
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.z+=b.vz; b.life--;
    b.mesh.position.set(b.x,1.1,b.z);
    b.mesh.rotation.y+=.35;
    if(b.life<=0||Math.abs(b.x)>55||Math.abs(b.z)>55){scene.remove(b.mesh);bullets.splice(i,1);continue;}
    for(let j=zombies.length-1;j>=0;j--){
      const z=zombies[j];
      if(Math.hypot(b.x-z.x,b.z-z.z)<z.r+.13){
        z.hp-=P.dmg; z.stun=5;
        blood(b.x,b.z,4);
        scene.remove(b.mesh); bullets.splice(i,1);
        if(z.hp<=0){
          score+=z.pts; P.kills++;
          blood(z.x,z.z,14); mkPickup(z.x,z.z);
          scene.remove(z.mesh); zombies.splice(j,1);
        }
        break;
      }
    }
  }

  // Particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.mesh.position.x+=p.vx; p.mesh.position.y+=p.vy; p.mesh.position.z+=p.vz;
    p.vy-=.004;
    p.mesh.material.opacity=Math.max(0,p.life/p.ml);
    if(--p.life<=0){scene.remove(p.mesh);parts.splice(i,1);}
  }

  // Pickups
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.pulse+=.08; pk.mesh.position.y=.4+Math.sin(pk.pulse)*.16; pk.mesh.rotation.y+=.04;
    if(--pk.life<=0){scene.remove(pk.mesh);pickups.splice(i,1);continue;}
    if(Math.hypot(pk.x-P.x,pk.z-P.z)<pk.r+P.r){
      if(pk.type==='hp') P.hp=Math.min(P.maxHp,P.hp+30);
      else{const o=P.spd;P.spd=.22;setTimeout(()=>P.spd=o,5000);}
      scene.remove(pk.mesh); pickups.splice(i,1);
    }
  }

  // Wave
  if(!waveDone&&zToSpawn<=0&&zombies.length===0){waveDone=true;waveTimer=120;}
  if(waveDone&&--waveTimer<=0) nextWave();

  // Camera smooth follow
  camX=lerp(camX,P.x,.1); camZ=lerp(camZ,P.z,.1);
  camera.position.set(camX,17,camZ+12);
  camera.lookAt(camX,0,camZ-1);
}

// ── HUD ─────────────────────────────────────────────────────────────────────
function rrect(x,y,w,h,r){
  hx.beginPath();
  hx.moveTo(x+r,y); hx.lineTo(x+w-r,y); hx.quadraticCurveTo(x+w,y,x+w,y+r);
  hx.lineTo(x+w,y+h-r); hx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  hx.lineTo(x+r,y+h); hx.quadraticCurveTo(x,y+h,x,y+h-r);
  hx.lineTo(x,y+r); hx.quadraticCurveTo(x,y,x+r,y);
  hx.closePath();
}
function redBtn(x,y,w,h,label){
  hx.save(); hx.shadowColor='#e02020'; hx.shadowBlur=22; hx.fillStyle='#c41a1a';
  rrect(x,y,w,h,10); hx.fill(); hx.restore();
  hx.fillStyle='#fff'; hx.textAlign='center';
  hx.font=`bold ${W*.065|0}px 'Courier New',monospace`;
  hx.fillText(label,x+w/2,y+h/2+10);
}

let W,H;
function drawHUD(){
  W=hud.width; H=hud.height;
  hx.clearRect(0,0,W,H);

  if(state===S.MENU){
    // Camera orbit on menu
    const t=Date.now()*.0004;
    camera.position.set(Math.sin(t)*10,14,Math.cos(t)*10+5);
    camera.lookAt(0,1,0);

    hx.fillStyle='rgba(0,0,0,.52)'; hx.fillRect(0,0,W,H);
    hx.save(); hx.textAlign='center';
    hx.shadowColor='#e02020'; hx.shadowBlur=45;
    hx.fillStyle='#e02020';
    hx.font=`bold ${W*.19|0}px 'Courier New',monospace`;
    hx.fillText('DEAD',W/2,H*.27); hx.fillText('ZONE',W/2,H*.43);
    hx.restore();
    hx.textAlign='center'; hx.fillStyle='#7dcf4f';
    hx.font=`${W*.042|0}px 'Courier New',monospace`;
    hx.fillText('☠  3D  ZOMBIE  SURVIVAL  ☠',W/2,H*.51);
    if(hs>0){hx.fillStyle='#d4a830';hx.font=`${W*.036|0}px 'Courier New',monospace`;hx.fillText(`BEST: ${hs}`,W/2,H*.59);}
    redBtn(W/2-(W*.62/2)|0,H*.65,W*.62|0,58,'▶  PLAY');
    hx.fillStyle='#445a50'; hx.font=`${W*.03|0}px 'Courier New',monospace`;
    hx.fillText('DRAG LEFT → MOVE   |   AUTO FIRES',W/2,H*.84);
    hx.fillText('Survive the zombie waves!',W/2,H*.89);
    return;
  }

  if(state===S.OVER){
    hx.fillStyle='rgba(0,0,0,.82)'; hx.fillRect(0,0,W,H);
    hx.save(); hx.textAlign='center';
    hx.font=`bold ${W*.13|0}px 'Courier New',monospace`;
    hx.fillStyle='#e02020'; hx.shadowColor='#e02020'; hx.shadowBlur=35;
    hx.fillText('YOU DIED',W/2,H*.28); hx.restore();
    hx.textAlign='center'; hx.fillStyle='#d4a830';
    hx.font=`bold ${W*.078|0}px 'Courier New',monospace`;
    hx.fillText(`SCORE: ${score}`,W/2,H*.42);
    if(score>0&&score>=hs){
      hx.fillStyle='#e080ff'; hx.font=`bold ${W*.05|0}px 'Courier New',monospace`;
      hx.fillText('✦  NEW BEST!  ✦',W/2,H*.5);
    } else {
      hx.fillStyle='#555'; hx.font=`${W*.038|0}px 'Courier New',monospace`;
      hx.fillText(`BEST: ${hs}`,W/2,H*.5);
    }
    hx.fillStyle='#7dcf4f'; hx.font=`${W*.037|0}px 'Courier New',monospace`;
    hx.fillText(`WAVE ${wave}  •  ${P.kills} KILLS`,W/2,H*.58);
    redBtn(W/2-(W*.6/2)|0,H*.67,W*.6|0,58,'↺  RETRY');
    return;
  }

  // ── playing ──
  // HP bar
  const hbW=W*.38|0,hbX=12,hbY=12;
  hx.fillStyle='#111'; hx.fillRect(hbX,hbY,hbW,20);
  const hpR=P.hp/P.maxHp;
  hx.fillStyle=hpR>.6?'#40e040':hpR>.3?'#e0c030':'#e03030';
  hx.fillRect(hbX,hbY,hbW*hpR,20);
  hx.strokeStyle='#444'; hx.lineWidth=1; hx.strokeRect(hbX,hbY,hbW,20);
  hx.fillStyle='#eee'; hx.font=`bold 11px 'Courier New',monospace`; hx.textAlign='left';
  hx.fillText(`HP ${P.hp}`,hbX+5,hbY+14);

  hx.textAlign='right';
  hx.fillStyle='#d4a830'; hx.font=`bold ${W*.055|0}px 'Courier New',monospace`;
  hx.fillText(score,W-12,35);
  hx.fillStyle='#7dcf4f'; hx.font=`${W*.038|0}px 'Courier New',monospace`;
  hx.fillText(`WAVE ${wave}`,W-12,58);
  hx.fillStyle='#e07030'; hx.font=`${W*.032|0}px 'Courier New',monospace`;
  hx.fillText(`☠ ${zombies.length+zToSpawn}`,W-12,76);

  // Wave clear
  if(waveDone&&waveTimer>60){
    const al=Math.min(1,(waveTimer-60)/25);
    hx.save(); hx.globalAlpha=al;
    hx.fillStyle='rgba(0,0,0,.72)'; hx.fillRect(0,H/2-44,W,88);
    hx.fillStyle='#7dcf4f'; hx.shadowColor='#7dcf4f'; hx.shadowBlur=24;
    hx.font=`bold ${W*.072|0}px 'Courier New',monospace`; hx.textAlign='center';
    hx.fillText(`WAVE ${wave} CLEAR!`,W/2,H/2+16); hx.restore();
  }

  // Damage flash
  if(flash>0){hx.fillStyle=`rgba(220,20,20,${flash*.045})`;hx.fillRect(0,0,W,H);flash--;}

  // Joystick
  if(joy.on){
    hx.save(); hx.globalAlpha=.3;
    hx.strokeStyle='#ccc'; hx.lineWidth=2;
    hx.beginPath(); hx.arc(joy.bx,joy.by,joy.mr,0,Math.PI*2); hx.stroke();
    hx.globalAlpha=.6; hx.fillStyle='#bbb';
    hx.beginPath(); hx.arc(joy.tx,joy.ty,22,0,Math.PI*2); hx.fill();
    hx.restore();
  }
}

// ── GAME LOOP ───────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  update();
  renderer.render(scene,camera);
  drawHUD();
}

// ── START ───────────────────────────────────────────────────────────────────
function startGame(){
  for(const z of zombies) scene.remove(z.mesh);
  for(const b of bullets) scene.remove(b.mesh);
  for(const p of parts)   scene.remove(p.mesh);
  for(const pk of pickups) scene.remove(pk.mesh);
  zombies.length=bullets.length=parts.length=pickups.length=0;
  score=0;wave=0;frame=0;flash=0;camX=0;camZ=0;
  for(const k in keys) delete keys[k];
  joy.on=false;joy.dx=0;joy.dy=0;
  mkPlayer(); nextWave(); state=S.PLAY;
}

// ── INPUT ───────────────────────────────────────────────────────────────────
function hitBtn(x,y){
  const w=W,h=H;
  if(state===S.MENU){const bw=w*.62,bx=w/2-bw/2,by=h*.65;return x>=bx&&x<=bx+bw&&y>=by&&y<=by+58;}
  if(state===S.OVER){const bw=w*.6, bx=w/2-bw/2,by=h*.67;return x>=bx&&x<=bx+bw&&y>=by&&y<=by+58;}
  return false;
}

hud.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const x=t.clientX,y=t.clientY;
    if(state===S.PLAY){
      if(x<innerWidth/2&&!joy.on){joy.on=true;joy.id=t.identifier;joy.bx=x;joy.by=y;joy.tx=x;joy.ty=y;joy.dx=0;joy.dy=0;}
    } else if(hitBtn(x,y)) startGame();
  }
},{passive:false});

hud.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==joy.id) continue;
    let dx=t.clientX-joy.bx,dy=t.clientY-joy.by;
    const d=Math.hypot(dx,dy);
    if(d>joy.mr){dx=dx/d*joy.mr;dy=dy/d*joy.mr;}
    joy.tx=joy.bx+dx;joy.ty=joy.by+dy;joy.dx=dx/joy.mr;joy.dy=dy/joy.mr;
  }
},{passive:false});

hud.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===joy.id){joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;}
},{passive:false});

let mDown=false;
hud.addEventListener('mousedown',e=>{
  const x=e.clientX,y=e.clientY;
  if(state===S.PLAY&&x<innerWidth/2){mDown=true;joy.on=true;joy.id='mouse';joy.bx=x;joy.by=y;joy.tx=x;joy.ty=y;joy.dx=0;joy.dy=0;}
  else if(hitBtn(x,y)) startGame();
});
window.addEventListener('mousemove',e=>{
  if(!mDown)return;
  let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;
  const d=Math.hypot(dx,dy);
  if(d>joy.mr){dx=dx/d*joy.mr;dy=dy/d*joy.mr;}
  joy.tx=joy.bx+dx;joy.ty=joy.by+dy;joy.dx=dx/joy.mr;joy.dy=dy/joy.mr;
});
window.addEventListener('mouseup',()=>{mDown=false;if(joy.id==='mouse'){joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;}});

// ── INIT ────────────────────────────────────────────────────────────────────
W=hud.width; H=hud.height;
loop();
</script>
