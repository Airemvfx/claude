<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DEADGRID — zombie survival prototype</title>
<style>
  :root{
    --bg:#12140f; --bone:#e4dcc4; --bone-dim:#8f8a74;
    --blood:#b03a2e; --blood-hi:#d9483b;
    --amber:#d9a441; --zgreen:#8fa763;
    --panel:#1d211acc; --edge:#3a4030;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--bone);
    font-family:"Courier New", ui-monospace, Menlo, monospace;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  #game{position:fixed; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges; background:var(--bg);}
  .hud{position:fixed; z-index:5; pointer-events:none; letter-spacing:.12em;
    text-transform:uppercase; font-weight:bold; text-shadow:1px 1px 0 #000;}
  #hudTop{top:calc(8px + env(safe-area-inset-top)); left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .chip{background:var(--panel); border:2px solid var(--edge); padding:5px 8px; font-size:11px;}
  #hpChip{min-width:132px;}
  #hpBar{height:8px; margin-top:4px; background:#000; border:1px solid var(--edge); position:relative;}
  #hpFill{position:absolute; inset:0; width:100%; background:var(--blood-hi); transition:width .15s steps(6);}
  #statsChip{text-align:right; line-height:1.5;}
  #killsVal{color:var(--blood-hi);} #timeVal{color:var(--amber);}
  #wpnChip{margin-top:6px; color:var(--amber);}
  #medChip{margin-top:6px; color:#a9c48a;}
  /* touch controls */
  .btn{position:fixed; z-index:6; border:2px solid var(--edge); background:var(--panel);
    color:var(--bone); font-family:inherit; font-weight:bold; letter-spacing:.1em;
    text-transform:uppercase; text-shadow:1px 1px 0 #000; display:flex;
    align-items:center; justify-content:center; touch-action:none;}
  .btn:active{background:#3a4030cc;}
  #atkBtn{right:calc(16px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom));
    width:88px; height:88px; border-radius:50%; font-size:13px; color:var(--blood-hi); border-color:#5c3028;}
  #swapBtn{right:calc(118px + env(safe-area-inset-right)); bottom:calc(30px + env(safe-area-inset-bottom));
    width:60px; height:60px; border-radius:50%; font-size:10px;}
  #medBtn{right:calc(30px + env(safe-area-inset-right)); bottom:calc(126px + env(safe-area-inset-bottom));
    width:60px; height:60px; border-radius:50%; font-size:10px; color:#a9c48a; border-color:#3d5330;}
  #lootBtn{right:calc(104px + env(safe-area-inset-right)); bottom:calc(112px + env(safe-area-inset-bottom));
    width:74px; height:74px; border-radius:50%; font-size:12px; color:var(--amber);
    border-color:#6e5522; display:none; animation:pulse 1s steps(2) infinite;}
  @keyframes pulse{50%{border-color:var(--amber);}}
  #stick{position:fixed; z-index:6; width:104px; height:104px; border-radius:50%;
    border:2px solid var(--edge); background:#1d211a66; display:none; pointer-events:none;}
  #knob{position:absolute; width:44px; height:44px; border-radius:50%; left:28px; top:28px;
    background:#3a4030; border:2px solid var(--bone-dim); box-sizing:border-box;}
  /* overlays */
  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px;
    background:#0c0e0ae6; padding:24px; letter-spacing:.14em; text-transform:uppercase;}
  .title{font-size:clamp(34px,9vw,64px); font-weight:bold; letter-spacing:.22em;
    color:var(--bone); text-shadow:3px 3px 0 var(--blood), 6px 6px 0 #000;}
  .sub{color:var(--zgreen); font-size:12px; letter-spacing:.3em;}
  .rules{color:var(--bone-dim); font-size:11px; line-height:2; letter-spacing:.12em; max-width:34ch;}
  .go{border:2px solid var(--amber); color:var(--amber); background:none; padding:14px 30px;
    font-family:inherit; font-size:14px; font-weight:bold; letter-spacing:.24em;
    text-transform:uppercase; cursor:pointer; animation:pulse 1.2s steps(2) infinite;}
  #deadOverlay{display:none;}
  #deadOverlay .title{color:var(--blood-hi); text-shadow:3px 3px 0 #400, 6px 6px 0 #000;}
  #dmgFlash{position:fixed; inset:0; z-index:8; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 40%, #b03a2e88 100%);}
  @media (prefers-reduced-motion: reduce){ .go,#lootBtn{animation:none;} }
</style>

<canvas id="game"></canvas>
<div id="dmgFlash"></div>

<div id="hudTop" class="hud">
  <div>
    <div class="chip" id="hpChip">HEALTH<div id="hpBar"><div id="hpFill"></div></div></div>
    <div class="chip" id="wpnChip">FISTS</div>
    <div class="chip" id="medChip">MEDKITS &times;0</div>
  </div>
  <div class="chip" id="statsChip">
    KILLS <span id="killsVal">0</span><br>
    SURVIVED <span id="timeVal">0:00</span>
  </div>
</div>

<div id="stick"><div id="knob"></div></div>
<button class="btn" id="atkBtn">ATTACK</button>
<button class="btn" id="swapBtn">SWAP</button>
<button class="btn" id="medBtn">HEAL</button>
<button class="btn" id="lootBtn">LOOT</button>

<div class="overlay" id="titleOverlay">
  <div class="title">DEADGRID</div>
  <div class="sub">zombie survival prototype</div>
  <div class="rules">
    the block is abandoned.<br>
    search crates &amp; lockers for<br>
    weapons &middot; ammo &middot; medkits.<br>
    the dead are already here.<br><br>
    left thumb &mdash; move<br>
    right thumb &mdash; fight
  </div>
  <button class="go" id="startBtn">Tap to survive</button>
</div>

<div class="overlay" id="deadOverlay">
  <div class="title">YOU DIED</div>
  <div class="rules" id="deadStats"></div>
  <button class="go" id="restartBtn">Rise again</button>
</div>

<script>
(function(){
'use strict';
/* ================= core ================= */
const TS=16, MW=72, MH=72;
const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
let W=0,H=0,SCALE=3;
function resize(){
  W=cvs.width=window.innerWidth; H=cvs.height=window.innerHeight;
  SCALE=Math.max(2,Math.round(Math.min(W,H)/240));
}
window.addEventListener('resize',resize); resize();

let seed=(Math.random()*1e9)|0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rng=mulberry32(seed);
const R=()=>rng(), RI=(a,b)=>a+Math.floor(R()*(b-a+1));

/* ================= audio ================= */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f0,f1,dur,type,vol){
  if(!AC)return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
const sfx={
  shoot:()=>beep(880,170,0.09,'square',0.10),
  swing:()=>beep(300,140,0.07,'triangle',0.10),
  hit:()=>beep(200,60,0.10,'sawtooth',0.14),
  die:()=>beep(110,35,0.28,'sawtooth',0.16),
  loot:()=>{beep(520,520,0.06,'square',0.08); setTimeout(()=>beep(780,780,0.09,'square',0.08),70);},
  hurt:()=>beep(140,60,0.22,'sawtooth',0.18),
  empty:()=>beep(700,650,0.04,'square',0.06),
  heal:()=>{beep(420,640,0.12,'triangle',0.10);},
};

/* ================= sprites ================= */
function makeSprite(rows,pal,flip){
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const g=c.getContext('2d'); const oy=16-rows.length;
  rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const col=pal[row[x]];
    if(col){ g.fillStyle=col; g.fillRect(flip?15-x:x, y+oy,1,1);} }});
  return c;
}
const PPAL={o:'#181109',H:'#4a2c14',S:'#e2b088',e:'#241812',J:'#7a4526',j:'#5c3116',P:'#46536b',B:'#26221e'};
const ZPAL={o:'#101408',H:'#2f3a22',S:'#8fa763',e:'#c03225',J:'#4a4550',j:'#8fa763',P:'#3a3630',B:'#22201c',b:'#6e2018'};

const bodyDown=[
"......ooooo",
".....oHHHHHo",
".....oHHHHHo",
".....oSSSSSo",
".....oSeSeSo",
".....oSSSSSo",
"....oojJJjoo",
"...oJoJJJJJoJo",
"...oJoJJJJJoJo",
"...oSoJjJjJoSo",
];
const bodyUp=[
"......ooooo",
".....oHHHHHo",
".....oHHHHHo",
".....oHHHHHo",
".....oHHHHHo",
".....oSSSSSo",
"....ooJJJJJoo",
"...oJoJJJJJoJo",
"...oJoJJJJJoJo",
"...oSoJJJJJoSo",
];
const bodySide=[
"......ooooo",
".....oHHHHHo",
".....oHHHHHo",
".....oSSSSSo",
".....oSSSeSo",
".....oSSSSSo",
"......oJJJo",
"......oJJJo",
"......oJjJo",
"......oSJJo",
];
const zBodyDown=[
"......ooooo",
".....oHHHHHo",
".....oSSSSSo",
".....oSSSSSo",
".....oeSSeSo",
".....oSSbSSo",
"....ooJJjJJoo",
"...oSoJJJJJoSo",
"...oSoJbJJJoSo",
"...oSoJJJjJoSo",
];
const zBodyUp=[
"......ooooo",
".....oHHHHHo",
".....oHHHHHo",
".....oHSHHHo",
".....oSSSSSo",
".....oSSSSSo",
"....ooJJjJJoo",
"...oSoJJJJJoSo",
"...oSoJJbJJoSo",
"...oSoJjJJJoSo",
];
const zBodySide=[
"......ooooo",
".....oHHHHHo",
".....oSSSSSo",
".....oSSSSSo",
".....oSSSeSo",
".....oSSbSSo",
"......oJjJo",
"....SSoJJJo",
"......oJbJo",
"......oJJJo",
];
const legsIdle=[
".....oPPoPPo",
".....oPPoPPo",
".....oBBoBBo",
".....oBBoBBo",
];
const legsA=[
"....oPPo.oPPo",
"....oPPo.oPPo",
"....oBBo.oBBo",
"....oBBo.oBBo",
];
const legsB=[
"......oPPPo",
"......oPPPo",
"......oBBBo",
"......oBBBo",
];
const sLegsIdle=[
".......oPPo",
".......oPPo",
".......oBBo",
".......oBBo",
];
const sLegsA=[
".....oPP.PPo",
".....oPP.PPo",
".....oBB.BBo",
".....oBB.BBo",
];
function build(body,pal,flip,side){
  const idle=side?sLegsIdle:legsIdle, A=side?sLegsA:legsA, B=side?sLegsIdle:legsB;
  return [
    makeSprite(body.concat(idle),pal,flip),
    makeSprite(body.concat(A),pal,flip),
    makeSprite(body.concat(B),pal,flip),
  ];
}
const SPR={
  player:{
    down: build(bodyDown,PPAL,false,false),
    up:   build(bodyUp,PPAL,false,false),
    right:build(bodySide,PPAL,false,true),
    left: build(bodySide,PPAL,true,true),
  },
  zombie:{
    down: build(zBodyDown,ZPAL,false,false),
    up:   build(zBodyUp,ZPAL,false,false),
    right:build(zBodySide,ZPAL,false,true),
    left: build(zBodySide,ZPAL,true,true),
  },
};

/* container sprites: [closed, open] per type */
function crateSpr(open){
  const c=document.createElement('canvas'); c.width=16; c.height=16; const g=c.getContext('2d');
  g.fillStyle='#171310'; g.fillRect(2,3,12,12);
  g.fillStyle=open?'#4a3a24':'#6e5636'; g.fillRect(3,4,10,10);
  g.fillStyle=open?'#2c2114':'#584428'; g.fillRect(3,4,10,2);
  g.fillStyle='#3d2f1c'; g.fillRect(3,8,10,1); g.fillRect(7,4,1,10);
  if(open){ g.fillStyle='#0e0b08'; g.fillRect(4,6,8,6);}
  return c;
}
function lockerSpr(open){
  const c=document.createElement('canvas'); c.width=16; c.height=16; const g=c.getContext('2d');
  g.fillStyle='#0e1012'; g.fillRect(3,1,10,14);
  g.fillStyle=open?'#2a3036':'#465059'; g.fillRect(4,2,8,12);
  g.fillStyle='#242b31'; g.fillRect(4,2,8,1);
  if(open){ g.fillStyle='#07080a'; g.fillRect(5,3,6,10); g.fillStyle='#465059'; g.fillRect(11,2,2,12); }
  else { g.fillStyle='#141a1e'; g.fillRect(8,2,1,12); g.fillStyle='#7d8891'; g.fillRect(6,7,1,2);}
  return c;
}
function medboxSpr(open){
  const c=document.createElement('canvas'); c.width=16; c.height=16; const g=c.getContext('2d');
  g.fillStyle='#1a1512'; g.fillRect(2,5,12,9);
  g.fillStyle=open?'#8a877c':'#c8c4b4'; g.fillRect(3,6,10,7);
  if(!open){ g.fillStyle='#b03a2e'; g.fillRect(7,7,2,5); g.fillRect(5,9,6,2); }
  else { g.fillStyle='#0e0b08'; g.fillRect(4,7,8,5); }
  return c;
}
const CSPR={crate:[crateSpr(false),crateSpr(true)],locker:[lockerSpr(false),lockerSpr(true)],medbox:[medboxSpr(false),medboxSpr(true)]};

/* ================= map generation ================= */
const T={GRASS:0,DIRT:1,ROAD:2,LINE:3,FLOOR:4,WALL:5,TREE:6,RUBBLE:7,CRACK:8};
let map,mapCvs,mapCtx,buildings,containers;
const at=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?T.WALL:map[y*MW+x];
const setT=(x,y,t)=>{ if(x>=0&&y>=0&&x<MW&&y<MH) map[y*MW+x]=t; };
const solidT=t=>t===T.WALL||t===T.TREE;

function genMap(){
  map=new Uint8Array(MW*MH); buildings=[]; containers=[];
  for(let i=0;i<map.length;i++) map[i]=T.GRASS;
  for(let n=0;n<70;n++){ const cx=RI(0,MW-1),cy=RI(0,MH-1),r=RI(1,3);
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)
      if(R()<0.6&&at(x,y)===T.GRASS) setT(x,y,T.DIRT); }
  const hr=RI(18,MH-22), vr=RI(18,MW-22);
  for(let x=0;x<MW;x++)for(let d=0;d<3;d++) setT(x,hr+d,(d===1&&x%4<2)?T.LINE:T.ROAD);
  for(let y=0;y<MH;y++)for(let d=0;d<3;d++) if(at(vr+d,y)!==T.LINE||d!==1) setT(vr+d,y,(d===1&&y%4<2)?T.LINE:T.ROAD);
  // buildings
  for(let tries=0;tries<90&&buildings.length<12;tries++){
    const w=RI(8,13),h=RI(7,11),x=RI(2,MW-w-3),y=RI(2,MH-h-3);
    let ok=true;
    for(let j=y-2;j<y+h+2&&ok;j++)for(let i=x-2;i<x+w+2;i++){
      const t=at(i,j); if(t!==T.GRASS&&t!==T.DIRT){ok=false;break;} }
    if(!ok)continue;
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)
      setT(i,j,(j===y||j===y+h-1||i===x||i===x+w-1)?T.WALL:(R()<0.12?T.CRACK:T.FLOOR));
    // doors: 1-2 gaps
    const doors=RI(1,2);
    for(let d=0;d<doors;d++){
      const side=RI(0,3);
      if(side===0) setT(RI(x+2,x+w-3),y,T.FLOOR);
      else if(side===1) setT(RI(x+2,x+w-3),y+h-1,T.FLOOR);
      else if(side===2) setT(x,RI(y+2,y+h-3),T.FLOOR);
      else setT(x+w-1,RI(y+2,y+h-3),T.FLOOR);
    }
    // ruin holes in walls (abandoned)
    if(R()<0.65){ const holes=RI(1,3);
      for(let k=0;k<holes;k++){
        if(R()<0.5) setT(RI(x+1,x+w-2), R()<0.5?y:y+h-1, T.RUBBLE);
        else setT(R()<0.5?x:x+w-1, RI(y+1,y+h-2), T.RUBBLE);
      } }
    buildings.push({x,y,w,h});
  }
  // containers inside buildings
  for(const b of buildings){
    const n=RI(1,3);
    for(let k=0;k<n;k++){
      for(let tr=0;tr<14;tr++){
        const tx=RI(b.x+1,b.x+b.w-2), ty=RI(b.y+1,b.y+b.h-2);
        if(at(tx,ty)!==T.FLOOR&&at(tx,ty)!==T.CRACK) continue;
        if(containers.some(c=>c.tx===tx&&c.ty===ty)) continue;
        // don't block the doorway ring
        let nearDoor=false;
        for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
          const t=at(tx+i,ty+j);
          if((t===T.FLOOR||t===T.CRACK)&&(tx+i===b.x||tx+i===b.x+b.w-1||ty+j===b.y||ty+j===b.y+b.h-1)) nearDoor=true; }
        if(nearDoor) continue;
        const r=R(), type=r<0.5?'crate':r<0.8?'locker':'medbox';
        containers.push({tx,ty,type,open:false}); break;
      }
    }
  }
  // stray barrels/crates near roads
  for(let k=0;k<8;k++){
    for(let tr=0;tr<20;tr++){
      const tx=RI(2,MW-3),ty=RI(2,MH-3);
      const t=at(tx,ty);
      if((t===T.GRASS||t===T.DIRT) && (at(tx+1,ty)===T.ROAD||at(tx-1,ty)===T.ROAD||at(tx,ty+1)===T.ROAD||at(tx,ty-1)===T.ROAD)){
        if(!containers.some(c=>c.tx===tx&&c.ty===ty)){ containers.push({tx,ty,type:'crate',open:false}); break; }
      }
    }
  }
  // trees & rubble outside
  for(let k=0;k<110;k++){
    const tx=RI(1,MW-2),ty=RI(1,MH-2);
    if(at(tx,ty)!==T.GRASS)continue;
    let clear=true;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const t=at(tx+i,ty+j);
      if(t===T.WALL||t===T.FLOOR||t===T.ROAD||t===T.LINE||t===T.CRACK)clear=false;}
    if(clear&&!containers.some(c=>c.tx===tx&&c.ty===ty)) setT(tx,ty,T.TREE);
  }
  for(let k=0;k<45;k++){ const tx=RI(0,MW-1),ty=RI(0,MH-1);
    const t=at(tx,ty); if(t===T.GRASS||t===T.DIRT) setT(tx,ty,T.RUBBLE); }
  renderMap();
  return {spawnX:(vr+1.5)*TS, spawnY:(hr+1.5)*TS};
}

function renderMap(){
  mapCvs=document.createElement('canvas'); mapCvs.width=MW*TS; mapCvs.height=MH*TS;
  mapCtx=mapCvs.getContext('2d'); const g=mapCtx;
  const r2=mulberry32(seed^0x9e37);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=at(x,y), px=x*TS, py=y*TS;
    if(t===T.GRASS||t===T.TREE){ g.fillStyle=(x+y)%2?'#48583a':'#425238'; g.fillRect(px,py,TS,TS);
      for(let k=0;k<5;k++){ g.fillStyle=r2()<0.5?'#3a4a30':'#54644150'; g.fillRect(px+(r2()*16|0),py+(r2()*16|0),1,1);} }
    else if(t===T.DIRT){ g.fillStyle='#63543c'; g.fillRect(px,py,TS,TS);
      for(let k=0;k<5;k++){ g.fillStyle=r2()<0.5?'#554730':'#6f6046'; g.fillRect(px+(r2()*16|0),py+(r2()*16|0),1,1);} }
    else if(t===T.ROAD||t===T.LINE){ g.fillStyle='#3b3b40'; g.fillRect(px,py,TS,TS);
      for(let k=0;k<4;k++){ g.fillStyle='#333338'; g.fillRect(px+(r2()*16|0),py+(r2()*16|0),2,1);}
      if(r2()<0.12){ g.fillStyle='#2b2b30'; g.fillRect(px+(r2()*10|0),py+(r2()*10|0),(r2()*6|0)+2,1);}
      if(t===T.LINE){ g.fillStyle='#8a824c'; g.fillRect(px+7,py,2,TS);} }
    else if(t===T.FLOOR||t===T.CRACK){ g.fillStyle='#57493a'; g.fillRect(px,py,TS,TS);
      g.fillStyle='#4e4134'; g.fillRect(px,py+4,TS,1); g.fillRect(px,py+9,TS,1); g.fillRect(px,py+14,TS,1);
      if(t===T.CRACK){ g.fillStyle='#3a3026';
        let cx=px+(r2()*12|0)+2, cy=py+2;
        for(let s=0;s<5;s++){ g.fillRect(cx,cy,1,2); cx+=(r2()*3|0)-1; cy+=2; } } }
    else if(t===T.WALL){ g.fillStyle='#211d18'; g.fillRect(px,py,TS,TS);
      g.fillStyle='#332c22'; g.fillRect(px,py,TS,3);
      g.fillStyle='#2a251d';
      for(let by=4;by<16;by+=4){ for(let bx=(by%8?0:4);bx<16;bx+=8) g.fillRect(px+bx,py+by,3,1);} }
    else if(t===T.RUBBLE){
      g.fillStyle='#4c4438'; g.fillRect(px,py,TS,TS);
      for(let k=0;k<7;k++){ g.fillStyle=r2()<0.5?'#6a6152':'#3a342a';
        g.fillRect(px+(r2()*13|0),py+(r2()*13|0),(r2()*3|0)+1,(r2()*2|0)+1);} }
  }
  // tree canopies on top
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) if(at(x,y)===T.TREE){
    const px=x*TS,py=y*TS;
    g.fillStyle='#00000040'; g.fillRect(px+3,py+11,10,3);
    g.fillStyle='#26361f'; g.fillRect(px+2,py+3,12,10);
    g.fillStyle='#31452a'; g.fillRect(px+3,py+2,10,10);
    g.fillStyle='#3d5433'; g.fillRect(px+4,py+3,5,4);
    g.fillStyle='#1c2a17'; g.fillRect(px+9,py+8,4,4);
  }
}

/* ================= entities ================= */
const WEAPONS={
  fists:{name:'FISTS',dmg:8,range:19,cd:0.42,melee:true},
  knife:{name:'KNIFE',dmg:16,range:21,cd:0.32,melee:true},
  bat:{name:'BAT',dmg:27,range:27,cd:0.6,melee:true},
  pistol:{name:'PISTOL',dmg:35,range:170,cd:0.34,melee:false},
};
let player,zombies,bullets,particles,floaters,swings;
let kills=0,elapsed=0,state='title',spawnTimer=0,shake=0;

function newPlayer(x,y){
  return {x,y,r:5,hp:100,maxhp:100,speed:88,dir:'down',anim:0,moving:false,
    weapon:'fists',owned:['fists'],ammo:0,medkits:0,atkCd:0,hurtT:0};
}
function spawnZombie(x,y){
  zombies.push({x,y,r:5,hp:40,speed:26+R()*22,dir:'down',anim:R()*2,moving:false,
    atkCd:R(),wanderT:0,wx:0,wy:0,flash:0,groan:R()*8});
}
function solidAt(px,py){
  return solidT(at(Math.floor(px/TS),Math.floor(py/TS)));
}
function blocked(e,nx,ny){
  const r=e.r;
  if(solidAt(nx-r,ny-r)||solidAt(nx+r,ny-r)||solidAt(nx-r,ny+r)||solidAt(nx+r,ny+r)) return true;
  for(const c of containers){
    const cx=c.tx*TS+8, cy=c.ty*TS+8;
    if(Math.abs(nx-cx)<r+7&&Math.abs(ny-cy)<r+7) return true;
  }
  return false;
}
function moveEntity(e,dx,dy,dt){
  const nx=e.x+dx*dt, ny=e.y+dy*dt;
  if(!blocked(e,nx,e.y)) e.x=nx;
  if(!blocked(e,e.x,ny)) e.y=ny;
}
function faceFrom(dx,dy,e){
  if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?'right':'left';
  else if(dy!==0) e.dir=dy>0?'down':'up';
}

/* blood decals painted straight into the map canvas (persistent) */
function blood(x,y,big){
  const n=big?14:5;
  for(let k=0;k<n;k++){
    mapCtx.fillStyle=k%3?'#5e1a12':'#77241a';
    mapCtx.fillRect(Math.round(x+(Math.random()-0.5)*(big?14:8)),Math.round(y+(Math.random()-0.5)*(big?12:8)),RI(1,2),RI(1,2));
  }
}
function puff(x,y,col,n,spd){
  for(let k=0;k<n;k++){ const a=Math.random()*Math.PI*2, s=(0.3+Math.random())*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.35+Math.random()*0.25,col}); }
}
function floatText(x,y,txt,col){ floaters.push({x,y,txt,col,t:1.4}); }

/* ================= loot ================= */
function rollLoot(type){
  let r=R();
  if(type==='medbox') r*=0.45;            // bias toward medkits
  if(type==='locker'&&r<0.5) r+=0.25;     // bias toward weapons
  if(r<0.26) return {kind:'ammo',n:RI(8,15)};
  if(r<0.50) return {kind:'medkit'};
  if(r<0.63) return {kind:'pistol'};
  if(r<0.77) return {kind:'bat'};
  if(r<0.90) return {kind:'knife'};
  return {kind:'empty'};
}
function giveLoot(loot,c){
  const x=c.tx*TS+8, y=c.ty*TS+2;
  if(loot.kind==='ammo'){ player.ammo+=loot.n; floatText(x,y,'+AMMO x'+loot.n,'#d9a441'); }
  else if(loot.kind==='medkit'){ player.medkits++; floatText(x,y,'+MEDKIT','#a9c48a'); }
  else if(loot.kind==='empty'){ floatText(x,y,'EMPTY...','#8f8a74'); }
  else { // weapon
    if(player.owned.includes(loot.kind)){
      const n=RI(6,10); player.ammo+=n; floatText(x,y,'+AMMO x'+n,'#d9a441');
    } else {
      player.owned.push(loot.kind); player.weapon=loot.kind;
      if(loot.kind==='pistol'){ player.ammo+=6; floatText(x,y,'+PISTOL (+6 AMMO)','#e4dcc4'); }
      else floatText(x,y,'+'+WEAPONS[loot.kind].name,'#e4dcc4');
    }
  }
  sfx.loot();
}

/* ================= combat ================= */
function attack(){
  if(player.atkCd>0) return;
  const w=WEAPONS[player.weapon];
  player.atkCd=w.cd;
  const dv={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]}[player.dir];
  if(w.melee){
    sfx.swing();
    swings.push({x:player.x,y:player.y,dir:Math.atan2(dv[1],dv[0]),t:0.12,range:w.range});
    let hitAny=false;
    for(const z of zombies){
      const dx=z.x-player.x, dy=z.y-player.y, d=Math.hypot(dx,dy);
      if(d<w.range+z.r){
        const ang=Math.atan2(dy,dx), fa=Math.atan2(dv[1],dv[0]);
        let diff=Math.abs(ang-fa); if(diff>Math.PI)diff=Math.PI*2-diff;
        if(diff<1.15||d<12){ hurtZombie(z,w.dmg,dx/d||0,dy/d||0); hitAny=true; }
      }
    }
    if(hitAny) sfx.hit();
  } else {
    if(player.ammo<=0){ sfx.empty(); floatText(player.x,player.y-14,'NO AMMO','#8f8a74'); return; }
    player.ammo--;
    // auto-aim nearest zombie in range, else facing
    let tx=dv[0],ty=dv[1],best=160;
    for(const z of zombies){ const d=Math.hypot(z.x-player.x,z.y-player.y);
      if(d<best){best=d; tx=(z.x-player.x)/d; ty=(z.y-player.y)/d;} }
    const sp=330;
    bullets.push({x:player.x+tx*6,y:player.y-4+ty*6,vx:tx*sp,vy:ty*sp,t:0.7});
    faceFrom(tx,ty,player);
    puff(player.x+tx*8,player.y-4+ty*8,'#ffd27a',3,60);
    shake=2; sfx.shoot();
  }
}
function hurtZombie(z,dmg,kx,ky){
  z.hp-=dmg; z.flash=0.1;
  z.x+=kx*5; z.y+=ky*5;
  blood(z.x,z.y+4,false); puff(z.x,z.y-4,'#8a2418',5,50);
  if(z.hp<=0){
    kills++; blood(z.x,z.y+4,true); puff(z.x,z.y-4,'#8a2418',10,70); sfx.die();
    zombies.splice(zombies.indexOf(z),1);
  }
}
function hurtPlayer(dmg){
  player.hp-=dmg; player.hurtT=0.4; shake=4; sfx.hurt();
  if(navigator.vibrate) navigator.vibrate(40);
  dmgFlash.style.opacity=1;
  setTimeout(()=>dmgFlash.style.opacity=0,180);
  blood(player.x,player.y+4,false);
  if(player.hp<=0){ player.hp=0; gameOver(); }
}

/* ================= input ================= */
const keys={};
window.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true;
  if(state!=='play')return;
  if(e.key===' '||e.key.toLowerCase()==='j'){attack();e.preventDefault();}
  if(e.key.toLowerCase()==='e') tryLoot();
  if(e.key.toLowerCase()==='q') swapWeapon();
  if(e.key.toLowerCase()==='h') useMedkit();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const stick=document.getElementById('stick'), knob=document.getElementById('knob');
let joyId=null, joyOx=0, joyOy=0, joyX=0, joyY=0, atkHeld=false;
function joyStart(e){
  for(const t of e.changedTouches){
    if(joyId===null && t.clientX<window.innerWidth*0.55 && t.clientY>window.innerHeight*0.3){
      joyId=t.identifier; joyOx=t.clientX; joyOy=t.clientY; joyX=joyY=0;
      stick.style.display='block'; stick.style.left=(joyOx-52)+'px'; stick.style.top=(joyOy-52)+'px';
      knob.style.left='28px'; knob.style.top='28px';
    }
  }
}
function joyMove(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      let dx=t.clientX-joyOx, dy=t.clientY-joyOy;
      const d=Math.hypot(dx,dy), max=40;
      if(d>max){dx=dx/d*max; dy=dy/d*max;}
      joyX=dx/max; joyY=dy/max;
      knob.style.left=(28+dx)+'px'; knob.style.top=(28+dy)+'px';
    }
  }
  e.preventDefault();
}
function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){ joyId=null; joyX=joyY=0; stick.style.display='none'; }
  }
}
cvs.addEventListener('touchstart',e=>{audio(); joyStart(e); e.preventDefault();},{passive:false});
cvs.addEventListener('touchmove',joyMove,{passive:false});
cvs.addEventListener('touchend',joyEnd); cvs.addEventListener('touchcancel',joyEnd);
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

const atkBtn=document.getElementById('atkBtn'), lootBtn=document.getElementById('lootBtn'),
      swapBtn=document.getElementById('swapBtn'), medBtn=document.getElementById('medBtn'),
      dmgFlash=document.getElementById('dmgFlash');
function press(el,fn,hold){
  el.addEventListener('pointerdown',e=>{audio(); fn(); if(hold===true)atkHeld=true; e.preventDefault();});
  if(hold===true){
    el.addEventListener('pointerup',()=>atkHeld=false);
    el.addEventListener('pointerleave',()=>atkHeld=false);
    el.addEventListener('pointercancel',()=>atkHeld=false);
  }
}
press(atkBtn,()=>{if(state==='play')attack();},true);
press(lootBtn,()=>{if(state==='play')tryLoot();});
press(swapBtn,()=>{if(state==='play')swapWeapon();});
press(medBtn,()=>{if(state==='play')useMedkit();});

function swapWeapon(){
  const i=player.owned.indexOf(player.weapon);
  player.weapon=player.owned[(i+1)%player.owned.length];
  sfx.empty();
}
function useMedkit(){
  if(player.medkits<=0||player.hp>=player.maxhp)return;
  player.medkits--; player.hp=Math.min(player.maxhp,player.hp+50);
  floatText(player.x,player.y-16,'+50 HP','#a9c48a'); sfx.heal();
}
function nearContainer(){
  let best=null,bd=26;
  for(const c of containers){ if(c.open)continue;
    const d=Math.hypot(c.tx*TS+8-player.x,c.ty*TS+8-player.y);
    if(d<bd){bd=d;best=c;} }
  return best;
}
function tryLoot(){
  const c=nearContainer(); if(!c)return;
  c.open=true; giveLoot(rollLoot(c.type),c);
}

/* ================= game flow ================= */
function startGame(){
  seed=(Math.random()*1e9)|0; rng=mulberry32(seed);
  const sp=genMap();
  player=newPlayer(sp.spawnX,sp.spawnY);
  zombies=[];bullets=[];particles=[];floaters=[];swings=[];
  kills=0;elapsed=0;spawnTimer=0;
  for(let k=0;k<20;k++){
    for(let tr=0;tr<30;tr++){
      const x=RI(1,MW-2)*TS+8, y=RI(1,MH-2)*TS+8;
      if(!solidAt(x,y)&&Math.hypot(x-player.x,y-player.y)>150&&!blocked({x,y,r:5},x,y)){ spawnZombie(x,y); break; }
    }
  }
  state='play';
  document.getElementById('titleOverlay').style.display='none';
  document.getElementById('deadOverlay').style.display='none';
}
function gameOver(){
  state='dead';
  const m=Math.floor(elapsed/60), s=Math.floor(elapsed%60);
  document.getElementById('deadStats').innerHTML=
    'kills &mdash; '+kills+'<br>survived &mdash; '+m+':'+String(s).padStart(2,'0')+'<br>the block keeps them all.';
  document.getElementById('deadOverlay').style.display='flex';
}
document.getElementById('startBtn').addEventListener('click',()=>{audio(); startGame();});
document.getElementById('restartBtn').addEventListener('click',()=>{audio(); startGame();});

/* ================= update ================= */
function update(dt){
  elapsed+=dt;
  // player move
  let mx=joyX,my=joyY;
  if(keys['w']||keys['arrowup'])my=-1; if(keys['s']||keys['arrowdown'])my=1;
  if(keys['a']||keys['arrowleft'])mx=-1; if(keys['d']||keys['arrowright'])mx=1;
  const ml=Math.hypot(mx,my);
  player.moving=ml>0.15;
  if(player.moving){
    if(ml>1){mx/=ml;my/=ml;}
    moveEntity(player,mx*player.speed,my*player.speed,dt);
    faceFrom(mx,my,player);
    player.anim+=dt*8;
  } else player.anim=0;
  player.atkCd=Math.max(0,player.atkCd-dt);
  player.hurtT=Math.max(0,player.hurtT-dt);
  if(atkHeld)attack();
  // zombies
  spawnTimer-=dt;
  if(spawnTimer<=0&&zombies.length<34){
    spawnTimer=3.2;
    for(let tr=0;tr<20;tr++){
      const x=RI(1,MW-2)*TS+8,y=RI(1,MH-2)*TS+8;
      if(!solidAt(x,y)&&Math.hypot(x-player.x,y-player.y)>220&&!blocked({x,y,r:5},x,y)){spawnZombie(x,y);break;}
    }
  }
  for(const z of zombies){
    z.flash=Math.max(0,z.flash-dt); z.atkCd=Math.max(0,z.atkCd-dt);
    const dx=player.x-z.x, dy=player.y-z.y, d=Math.hypot(dx,dy);
    let vx=0,vy=0;
    if(d<120){ vx=dx/d*z.speed*1.6; vy=dy/d*z.speed*1.6; z.groan-=dt;
      if(z.groan<=0){z.groan=4+R()*6; if(d<90)beep(70+R()*40,50,0.3,'sawtooth',0.05);} }
    else {
      z.wanderT-=dt;
      if(z.wanderT<=0){ z.wanderT=1.5+R()*2.5; const a=R()*Math.PI*2;
        if(R()<0.35){z.wx=0;z.wy=0;} else {z.wx=Math.cos(a);z.wy=Math.sin(a);} }
      vx=z.wx*z.speed*0.5; vy=z.wy*z.speed*0.5;
    }
    // separation
    for(const o of zombies){ if(o===z)continue;
      const ox=z.x-o.x, oy=z.y-o.y, od=Math.hypot(ox,oy);
      if(od>0&&od<11){ vx+=ox/od*30; vy+=oy/od*30; } }
    if(vx||vy){ moveEntity(z,vx,vy,dt); faceFrom(vx,vy,z); z.moving=true; z.anim+=dt*6; }
    else z.moving=false;
    if(d<z.r+player.r+4&&z.atkCd<=0){ z.atkCd=0.95; hurtPlayer(9+RI(0,4)); }
  }
  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.t-=dt;
    let dead=b.t<=0||solidAt(b.x,b.y);
    if(dead&&b.t>0)puff(b.x,b.y,'#a9a08a',4,60);
    if(!dead)for(const z of zombies){
      if(Math.hypot(z.x-b.x,(z.y-5)-b.y)<z.r+3){
        hurtZombie(z,WEAPONS.pistol.dmg,b.vx/330,b.vy/330); sfx.hit(); dead=true; break; }
    }
    if(dead)bullets.splice(i,1);
  }
  for(let i=swings.length-1;i>=0;i--){ swings[i].t-=dt; if(swings[i].t<=0)swings.splice(i,1); }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.9; p.vy*=0.9; p.t-=dt; if(p.t<=0)particles.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y-=14*dt; f.t-=dt; if(f.t<=0)floaters.splice(i,1); }
  shake=Math.max(0,shake-dt*20);
  lootBtn.style.display=nearContainer()?'flex':'none';
}

/* ================= render ================= */
function frameFor(e,set){
  const s=set[e.dir];
  if(!e.moving)return s[0];
  const f=Math.floor(e.anim)%4;
  return s[f===1?1:f===3?2:0];
}
let hudCache='';
function render(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#12140f'; ctx.fillRect(0,0,W,H);
  if(!player)return;
  const vw=W/SCALE, vh=H/SCALE;
  let camx=player.x-vw/2, camy=player.y-vh/2;
  camx=Math.max(0,Math.min(MW*TS-vw,camx)); camy=Math.max(0,Math.min(MH*TS-vh,camy));
  if(shake>0){ camx+=(Math.random()-0.5)*shake; camy+=(Math.random()-0.5)*shake; }
  camx=Math.round(camx*SCALE)/SCALE; camy=Math.round(camy*SCALE)/SCALE;
  ctx.save(); ctx.scale(SCALE,SCALE); ctx.translate(-camx,-camy);
  ctx.drawImage(mapCvs,0,0);
  // containers
  for(const c of containers){
    const s=CSPR[c.type][c.open?1:0];
    ctx.drawImage(s,c.tx*TS,c.ty*TS);
    if(!c.open&&Math.floor(elapsed*2)%2===0){ ctx.fillStyle='#d9a44170'; ctx.fillRect(c.tx*TS+7,c.ty*TS-3,2,2); }
  }
  // entities sorted by y
  const ents=[...zombies.map(z=>({e:z,z:1})),{e:player,z:0}].sort((a,b)=>a.e.y-b.e.y);
  for(const {e,z} of ents){
    ctx.fillStyle='#00000045';
    ctx.fillRect(Math.round(e.x-5),Math.round(e.y+3),10,3);
    const spr=frameFor(e,z?SPR.zombie:SPR.player);
    const bob=e.moving?(Math.floor(e.anim)%2):0;
    const px=Math.round(e.x-8), py=Math.round(e.y-11-bob);
    if(z&&e.flash>0){
      ctx.drawImage(spr,px,py);
      ctx.fillStyle='#ffffff90'; ctx.fillRect(px+3,py+2,10,12);
    } else {
      if(!z&&player.hurtT>0&&Math.floor(player.hurtT*20)%2===0)ctx.globalAlpha=0.4;
      ctx.drawImage(spr,px,py);
      ctx.globalAlpha=1;
    }
    // pistol in hand
    if(!z&&player.weapon==='pistol'){
      ctx.fillStyle='#1b1b1f';
      const gx=Math.round(e.x), gy=Math.round(e.y-3);
      if(e.dir==='right')ctx.fillRect(gx+5,gy,5,2);
      else if(e.dir==='left')ctx.fillRect(gx-10,gy,5,2);
      else if(e.dir==='down')ctx.fillRect(gx+4,gy+2,2,5);
      else ctx.fillRect(gx-6,gy-2,2,5);
    }
  }
  // swings
  for(const s of swings){
    ctx.strokeStyle='#e4dcc4'+(s.t>0.06?'cc':'55'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(s.x,s.y-3,s.range-4,s.dir-0.9,s.dir+0.9); ctx.stroke();
  }
  // bullets
  ctx.fillStyle='#ffd27a';
  for(const b of bullets)ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,3,2);
  // particles
  for(const p of particles){ ctx.fillStyle=p.col; ctx.globalAlpha=Math.min(1,p.t*4);
    ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); }
  ctx.globalAlpha=1;
  // floaters
  ctx.font='bold 7px monospace'; ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.t);
    ctx.fillStyle='#000'; ctx.fillText(f.txt,Math.round(f.x)+1,Math.round(f.y)+1);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,Math.round(f.x),Math.round(f.y)); }
  ctx.globalAlpha=1; ctx.textAlign='left';
  ctx.restore();
  // night vignette
  const grd=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(4,6,3,0.55)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  // HUD
  const w=WEAPONS[player.weapon];
  const wl=w.melee?w.name:w.name+' ×'+player.ammo;
  const m=Math.floor(elapsed/60), s2=Math.floor(elapsed%60);
  const hc=player.hp+'|'+wl+'|'+player.medkits+'|'+kills+'|'+s2;
  if(hc!==hudCache){ hudCache=hc;
    document.getElementById('hpFill').style.width=(player.hp/player.maxhp*100)+'%';
    document.getElementById('wpnChip').textContent=wl;
    document.getElementById('medChip').textContent='MEDKITS ×'+player.medkits;
    document.getElementById('killsVal').textContent=kills;
    document.getElementById('timeVal').textContent=m+':'+String(s2).padStart(2,'0');
  }
}

/* ================= loop ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play')update(dt);
  render();
  requestAnimationFrame(loop);
}
// pre-generate a map behind the title screen so it shows as backdrop
const sp0=genMap(); player=newPlayer(sp0.spawnX,sp0.spawnY);
zombies=[];bullets=[];particles=[];floaters=[];swings=[];
requestAnimationFrame(loop);
})();
</script>
